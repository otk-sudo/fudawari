<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#16171B}
a{color:#6AA8FF}a:hover{color:#9CC5FF}
</style>
</helmet>
<div style="font-family: 'Noto Sans JP', 'Hiragino Sans', 'Meiryo', system-ui, sans-serif; color: #E4E6EA; background: #16171B; min-height: 100vh; font-size: 13px; display: flex; flex-wrap: wrap">
  <div style="flex: 0 0 64px; align-self: stretch; min-height: 100vh"><dc-import name="SideNav" active="一覧" role="{{role}}" open="true" hint-size="64px,100%"></dc-import></div>

  <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 14px; background: #1F2126; border-bottom: 1px solid #2A2D33">
      <h1 style="margin: 0; font-size: 15px; font-weight: 700">札割り一覧</h1>
      <span style="font-size: 12px; color: #9AA0AA">左メニューの「設定」を押した状態</span>
      <span style="flex: 1 1 20px"></span>
      <span role="group" aria-label="見え方の確認（モック用）" style="display: flex; align-items: center; gap: 2px; padding: 2px 2px 2px 8px; border: 1px dashed #4A4F58; border-radius: 4px">
        <span style="font-size: 10px; color: #9AA0AA; margin-right: 2px">見え方の確認</span>
        <sc-for list="{{roleOpts}}" as="r" hint-placeholder-count="3">
          <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="{{r.style}}">{{r.label}}</button>
        </sc-for>
      </span>
    </div>

    <div aria-hidden="true" style="padding: 16px 14px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 12px; color: #9AA0AA">（後ろは設定を開く前の画面のまま。例：札割り一覧）</span>
      <div style="height: 120px; background: #1F2126; border: 1px solid #2A2D33; border-radius: 6px"></div>
      <div style="height: 260px; background: #1F2126; border: 1px solid #2A2D33; border-radius: 6px"></div>
      <div style="height: 200px; background: #1F2126; border: 1px solid #2A2D33; border-radius: 6px"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { role: 'admin', theme: 'dark', size: 'mid', trayView: 'dense', sort: 'class', banner: true }; }
  renderVals() {
    const roleOpts = [['user', '一般'], ['collab', '協力者'], ['admin', '管理者']].map(([k, label]) => ({
      label, on: this.state.role === k, pick: () => this.setState({ role: k }),
      style: 'min-height: 26px; padding: 0 8px; border-radius: 3px; font-family: inherit; font-size: 11px; cursor: pointer; border: 0; background: ' + (this.state.role === k ? '#3D6FD0' : 'transparent') + '; color: ' + (this.state.role === k ? '#FFFFFF' : '#C9CDD3')
    }));
    const seg = (key, opts) => opts.map(([v, label], i) => ({
      label, on: this.state[key] === v, pick: () => this.setState({ [key]: v }),
      style: 'min-height: 34px; padding: 0 14px; font-family: inherit; font-size: 12px; cursor: pointer; border: 1px solid #3A3E46; '
        + (i > 0 ? 'border-left: 0; ' : '') + 'border-radius: ' + (i === 0 ? '4px 0 0 4px' : i === opts.length - 1 ? '0 4px 4px 0' : '0') + '; '
        + 'background: ' + (this.state[key] === v ? '#3D6FD0' : 'transparent') + '; color: ' + (this.state[key] === v ? '#FFFFFF' : '#C9CDD3') + '; font-weight: ' + (this.state[key] === v ? '700' : '400')
    }));
    const role = this.state.role;
    return {
      role, roleOpts,
      roleLabel: role === 'admin' ? '管理者' : '協力者',
      loggedIn: role !== 'user',
      banner: this.state.banner, toggleBanner: () => this.setState({ banner: !this.state.banner }),
      displayRows: [
        { title: '画面モード', note: '明るい場所ではライトが見やすくなります', opts: seg('theme', [['dark', 'ダーク'], ['light', 'ライト'], ['system', '端末に合わせる']]) },
        { title: '文字の大きさ', note: '一覧・割り振り画面の文字の大きさ', opts: seg('size', [['small', '小'], ['mid', '標準'], ['large', '大']]) },
        { title: '控えの表示', note: '割り振り画面の控えを開いたときの表示', opts: seg('trayView', [['dense', '一行'], ['card', 'カード']]) },
        { title: '控えの並び順', note: '割り振り画面を開いたときの並び順', opts: seg('sort', [['class', '艦型'], ['lv', 'Lv'], ['boost', '特効の強さ'], ['name', '名前']]) }
      ]
    };
  }
}
</script>
</body>
</html>
