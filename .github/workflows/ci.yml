# PR ごとと main への push で、型・Lint・単体テスト・ビルド・画面テストを実行する
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR では古い実行を取り消す。main（本番）への push は取り消さず、すべてのコミットに結果を残す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Next.js の匿名の利用統計を送らない
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: 型・Lint・単体テスト・ビルド
    # ubuntu-latest の切り替え（Ubuntu 26）で挙動が変わらないよう固定する
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: 単体テスト
        run: npm test
      - name: ビルド（静的書き出し）
        run: npm run build

  e2e:
    name: 画面テスト（Playwright）
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Playwright の版を調べる
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright のブラウザをキャッシュから戻す
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # OS イメージと Playwright の版が同じときだけ使い回す
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.pw-version.outputs.version }}
      - name: Playwright のブラウザを入れる（キャッシュなし）
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Playwright の依存パッケージを入れる（キャッシュあり）
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: 画面テスト（CI の中でビルドした静的出力に対して実行）
        run: npm run test:e2e
      - name: レポートを残す（再実行で通った不安定なテストの調査にも使う）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
